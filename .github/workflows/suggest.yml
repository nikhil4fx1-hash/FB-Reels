name: Reels Trending Suggestions

on:
  schedule:
    # 01:30-17:30 UTC = every hour from 07:00 to 23:00 IST
    - cron: '30 1-17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels-state
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Collect trending topics and send to Telegram
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests feedparser
          python suggest.py

      - name: Save state
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add pending.json || true
          git diff --cached --quiet || (git commit -m "reels: update state" && git push)
