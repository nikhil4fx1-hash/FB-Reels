name: Reels 2 - Check Telegram and post

on:
  schedule:
    # Every 30 minutes. Use '*/10 * * * *' for faster replies (uses more Actions minutes on private repos).
    - cron: '*/30 * * * *'
  workflow_dispatch:   # press "Run workflow" to post immediately after sending photos

permissions:
  contents: write

concurrency:
  group: reels-state

jobs:
  poll-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check if photos have arrived
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests
          python check_telegram.py

      - name: Install system dependencies
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python libraries
        if: steps.check.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build reel and post to Facebook
        if: steps.check.outputs.ready == 'true'
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # USE_ELEVENLABS: '1'
          # EDGE_VOICE: ml-IN-SobhanaNeural
        run: python main.py publish

      - name: Save state
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add pending.json || true
          git diff --cached --quiet || (git commit -m "reels: update state" && git push)
