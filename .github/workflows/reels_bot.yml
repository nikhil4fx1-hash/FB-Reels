name: Auto Facebook Reels Bot

on:
  schedule:
    # UTC സമയമാണ് ഇവിടെ. 03:30 UTC = 09:00 AM IST | 12:30 UTC = 06:00 PM IST
    - cron: '30 3,12 * * *'
  workflow_dispatch: # ഇത് വെച്ചാൽ നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും ഗിറ്റ്ഹബ്ബിൽ വന്ന് മാന്വൽ ആയി റൺ ചെയ്യിക്കാം

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (For MoviePy)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Reels Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python main.py
