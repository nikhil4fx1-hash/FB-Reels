name: Reels 1 - Prepare and ask for photos

on:
  schedule:
    # 03:00 UTC = 08:30 AM IST | 11:30 UTC = 05:00 PM IST
    - cron: '0 3,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels-state

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create topic + script and send to Telegram
        env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py prepare

      - name: Save state
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add pending.json || true
          git diff --cached --quiet || (git commit -m "reels: update state" && git push)
